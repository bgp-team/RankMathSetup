<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Main Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .required-note {
            color: #666;
            font-size: 13px;
            font-style: italic;
            margin-bottom: 30px;
            text-align: center;
        }
        h2 {
            color: #555;
            font-size: 20px;
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        label .optional {
            font-weight: normal;
            color: #888;
            font-size: 13px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .faq-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 3px solid #667eea;
        }
        .faq-item h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #333;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Add Game</h1>
        <p class="required-note">* All required fields must be filled</p>
        
        <form id="gameForm">
            <h2>📋 Basic Information</h2>
            
            <div class="form-group">
                <label>Game Name *</label>
                <input type="text" id="gameName" required>
            </div>

            <div class="form-group">
                <label>Meta Description *</label>
                <textarea id="metaDescription" required></textarea>
            </div>

            <div class="form-group">
                <label>Author Name *</label>
                <input type="text" id="authorName" required>
            </div>

            <div class="form-group">
                <label>Iframe URL *</label>
                <input type="url" id="iframeUrl" required placeholder="https://example.com/game">
            </div>

            <h2>🔐 Website & Credentials</h2>

            <div class="form-group">
                <label>Website URL *</label>
                <input type="url" id="websiteUrl" required>
            </div>

            <div class="form-group">
                <label>Username *</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" required>
            </div>

            <h2>🌐 Additional URLs</h2>

            <div class="form-group">
                <label>Wikipedia Game URL <span class="optional">(optional)</span></label>
                <input type="url" id="wikipediaGameUrl">
            </div>

            <div class="form-group">
                <label>App Store URL *</label>
                <input type="url" id="appStoreUrl" required>
            </div>

            <div class="form-group">
                <label>Google Play URL *</label>
                <input type="url" id="googlePlayUrl" required>
            </div>

            <h2>👨‍💻 Developer Information</h2>

            <div class="form-group">
                <label>Developer Name *</label>
                <input type="text" id="developerName" required>
            </div>

            <div class="form-group">
                <label>Wikipedia Developer URL <span class="optional">(optional)</span></label>
                <input type="url" id="wikipediaDeveloperUrl">
            </div>

            <div class="form-group">
                <label>Twitter Developer URL <span class="optional">(optional)</span></label>
                <input type="url" id="twitterDeveloperUrl">
            </div>

            <h2>🕹️ Similar Games</h2>

            <div class="form-group">
                <label>Similar Game 1 *</label>
                <input type="text" id="similarGame1" required placeholder="First similar game name">
            </div>

            <div class="form-group">
                <label>Similar Game 2 *</label>
                <input type="text" id="similarGame2" required placeholder="Second similar game name">
            </div>

            <h2>📝 Content</h2>

            <div class="form-group">
                <label>Post Content *</label>
                <textarea id="content" required placeholder="Full post content..." style="min-height: 200px;"></textarea>
            </div>

            <h2>🖼️ Images</h2>

            <!-- Ajout: Logo en premier -->
            <div class="form-group">
                <label>Logo Image *</label>
                <input type="file" id="logoImage" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Favicon Image *</label>
                <input type="file" id="faviconImage" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Post Image *</label>
                <input type="file" id="postImage" accept="image/*" required>
            </div>

            <div class="form-group">
                <label>Thumbnail Image *</label>
                <input type="file" id="thumbnailImage" accept="image/*" required>
            </div>

            <h2>❓ FAQ Section <span class="optional" style="font-size: 14px; color: #888;">(optional)</span></h2>

            <div class="faq-item">
                <h3>FAQ 1</h3>
                <div class="form-group">
                    <label>Question 1 <span class="optional">(optional)</span></label>
                    <input type="text" id="faqQuestion1">
                </div>
                <div class="form-group">
                    <label>Answer 1 <span class="optional">(optional)</span></label>
                    <textarea id="faqAnswer1"></textarea>
                </div>
            </div>

            <div class="faq-item">
                <h3>FAQ 2</h3>
                <div class="form-group">
                    <label>Question 2 <span class="optional">(optional)</span></label>
                    <input type="text" id="faqQuestion2">
                </div>
                <div class="form-group">
                    <label>Answer 2 <span class="optional">(optional)</span></label>
                    <textarea id="faqAnswer2"></textarea>
                </div>
            </div>

            <div class="faq-item">
                <h3>FAQ 3</h3>
                <div class="form-group">
                    <label>Question 3 <span class="optional">(optional)</span></label>
                    <input type="text" id="faqQuestion3">
                </div>
                <div class="form-group">
                    <label>Answer 3 <span class="optional">(optional)</span></label>
                    <textarea id="faqAnswer3"></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn">Send</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        // 🔥 PUT YOUR N8N WEBHOOK URL HERE
        const WEBHOOK_URL = 'https://n8n.srv1053791.hstgr.cloud/webhook/123087d9-ebc3-47da-8e5d-99a750b7f5c8';

        const form = document.getElementById('gameForm');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');

        // Convert file to Base64
        async function toBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            message.style.display = 'none';

            try {
                // Get files and convert to base64
                const logoFile = document.getElementById('logoImage').files[0];
                const faviconFile = document.getElementById('faviconImage').files[0];
                const postFile = document.getElementById('postImage').files[0];
                const thumbnailFile = document.getElementById('thumbnailImage').files[0];

                const logoBase64 = await toBase64(logoFile);
                const faviconBase64 = await toBase64(faviconFile);
                const postBase64 = await toBase64(postFile);
                const thumbnailBase64 = await toBase64(thumbnailFile);

                // Build FAQ array (only include if both question and answer are filled)
                const faqItems = [];
                for (let i = 1; i <= 3; i++) {
                    const question = document.getElementById(`faqQuestion${i}`).value.trim();
                    const answer = document.getElementById(`faqAnswer${i}`).value.trim();
                    
                    if (question && answer) {
                        faqItems.push({ question, answer });
                    }
                }

                // Build JSON payload
                const payload = {
                    gameName: document.getElementById('gameName').value,
                    metaDescription: document.getElementById('metaDescription').value,
                    authorName: document.getElementById('authorName').value,
                    iframeUrl: document.getElementById('iframeUrl').value,
                    websiteUrl: document.getElementById('websiteUrl').value,
                    wikipediaGameUrl: document.getElementById('wikipediaGameUrl').value || null,
                    appStoreUrl: document.getElementById('appStoreUrl').value,
                    googlePlayUrl: document.getElementById('googlePlayUrl').value,
                    developerName: document.getElementById('developerName').value,
                    wikipediaDeveloperUrl: document.getElementById('wikipediaDeveloperUrl').value || null,
                    twitterDeveloperUrl: document.getElementById('twitterDeveloperUrl').value || null,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    similarGame1: document.getElementById('similarGame1').value,
                    similarGame2: document.getElementById('similarGame2').value,
                    content: document.getElementById('content').value,
                    // Added order: logo, favicon, post, thumbnail
                    logoImage: logoBase64,
                    faviconImage: faviconBase64,
                    postImage: postBase64,
                    thumbnailImage: thumbnailBase64,
                    faq: faqItems.length > 0 ? faqItems : null,
                    triggered_by: 'client',
                    timestamp: new Date().toISOString()
                };

                // Send JSON to n8n
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showMessage('✅ Game sent successfully!', 'success');
                    form.reset();
                    // Clear file inputs explicitly to avoid file selection cache
                    ['logoImage','faviconImage','postImage','thumbnailImage'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.value = '';
                    });
                } else {
                    throw new Error('Error while sending');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
